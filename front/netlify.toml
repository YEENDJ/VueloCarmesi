# Configuración del front en Netlify. El repo es un monorepo con workspaces de
# npm: en el panel, Base directory = raíz (vacío) y Package directory = front.
# Las rutas de este archivo son relativas a la raíz del repo, no a front/.
# Paso a paso de la migración: docs/migracion-netlify.md

[build]
  command = "npm run build:front"
  publish = "front/.next"
  # Cada deploy a producción gasta 15 de los 300 créditos del plan gratuito.
  # Sin esto, un merge que solo toca back/ también reconstruiría el front.
  # Sale con 0 (= no construir) si no cambió nada que afecte al front.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- front/ package.json package-lock.json"

[build.environment]
  NODE_VERSION = "22"
